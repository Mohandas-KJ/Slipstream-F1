[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sliplib"
version = "0.1.0"
description = "Formula 1 Data Analytics and Race Intelligence Library"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Mohan Das" }
]
dependencies = [
    "fastf1>=3.4.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["Sliplib*", "configuration*"]
